[package]
name = "kebloop-platform"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true
description = "Linux integration layer for Kebloop (no GTK): desktop entries, file index, clipboard, power, autostart, shortcuts, tray"

[dependencies]
kebloop-services.workspace = true
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
async-channel = "2"
ignore = "0.4"
notify = { version = "8", default-features = false }
rustix = { version = "1", features = ["event", "pipe", "fs", "net", "process"] }
wayland-client = "0.31"
wayland-protocols = { version = "0.32", features = ["client", "staging"] }
wayland-protocols-wlr = { version = "0.3", features = ["client"] }
zbus = "5"
ashpd = { version = "0.13", default-features = false, features = ["async-io", "global_shortcuts"] }
ksni = { version = "0.3", default-features = false, features = ["async-io", "blocking"] }
futures-lite = "2"
x11rb = { version = "0.13", features = ["xfixes", "randr", "xtest", "record", "res"] }
base64 = "0.22"
tempfile = "3"

[dev-dependencies]
tempfile = "3"
