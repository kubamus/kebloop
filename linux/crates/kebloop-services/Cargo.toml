[package]
name = "kebloop-services"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
description = "Platform-neutral Kebloop application logic: configuration, stores, automation, localization"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
url = "2"
percent-encoding = "2"
unicode-normalization = "0.1"
uuid = { version = "1", features = ["v4"] }
nix = { version = "0.30", default-features = false, features = ["signal", "process", "fs"] }
kebloop-core = { workspace = true }
jiff = "0.2"
regex = "1"
ureq = { version = "3", default-features = false, features = ["rustls"] }

[dev-dependencies]
tempfile = "3"
